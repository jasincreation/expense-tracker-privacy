.themes{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.theme-opt{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;border:2px solid var(--line);background:var(--surface-2);text-align:left;font-weight:500}
.theme-opt.on{border-color:var(--in)}
.theme-opt{min-width:0;font-size:14px}
.theme-opt .sw{width:34px;height:34px;border-radius:9px;flex:none;border:1px solid rgba(128,128,128,.35)}
*,*::before,*::after{box-sizing:inherit; -webkit-tap-highlight-color: transparent !important; -webkit-touch-callout: none;}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; height:100%; background:var(--bg); color:var(--ink);
  font-family:"Schibsted Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px; line-height:1.45; -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
.num,.big.num,.mid.num,.amt.num{font-variant-numeric:normal;letter-spacing:.04em;word-spacing:0}
.comma{font-family:system-ui,-apple-system,Roboto,"Segoe UI",sans-serif;font-weight:inherit}
.hide{display:none !important}
:focus-visible{outline:2px solid var(--in);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

/* ---------- login ---------- */
#login{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(40px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px))}
.login-card{width:100%;max-width:320px;display:flex;flex-direction:column;align-items:center;text-align:center}
.lock-icon{width:52px;height:52px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink);margin-bottom:16px;box-shadow:var(--shadow)}
.brand-title{font-size:22px;font-weight:700;letter-spacing:-.02em;color:var(--ink);margin-bottom:4px}
.brand-sub{font-size:13.5px;color:var(--muted)}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{
  width:100%;padding:11px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;
}

/* ---------- shell ---------- */
#app{min-height:100dvh;display:flex;flex-direction:column;max-width:720px;margin:0 auto}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(10,14,10,.45);display:flex;align-items:flex-end;justify-content:center}

header{justify-content:flex-start}

.page-h{display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:1;background:var(--bg);

/* ---------- splash screen ---------- */
#splash{

<script>
"use strict";
/* ============================================================
   Login — offline expense tracker.
   All data stays in this app on this device (localStorage), plus an
   optional backup file you choose. No server, no accounts.
   ============================================================ */

const KEY="Login.v1", SKEY="Login.session";
const BACKUP_NAME="Expense_Backup.json";
const DEFAULT_CATS=["Rent","Insurance","Subscriptions","Grocery","Shopping","Other expense","Tax"];
const blank=()=>({
  v:1,
  auth:{pin:null},
  cfg:{currency:"€",opening:0,burn:0,theme:"auto"},
  cats:[...DEFAULT_CATS],
  srcs:["Salary","Bonus","Other income"],
  tx:[],
  updated:null
});
let S=blank(), view="dash", sheetEl=null;
let fileHandle=null, autoSaveName=null;               // browser only: File System Access handle
const supportsFS=typeof window.showSaveFilePicker==="function";
const nativeIO=window.AndroidStorage||null;           // provided by the Android app (MainActivity.kt)
const canAutoSave=!!nativeIO||supportsFS;
/* Premium comes ONLY from Google Play (via the Android app). It is never stored in settings or backups. */
let premium="", products=[], plansOpen=false;
try{ if(nativeIO&&typeof nativeIO.getPremium==="function") premium=String(nativeIO.getPremium()||""); }catch(e){}
const isPremium=()=>!!premium;
const PLAN_NAMES={monthly:"Monthly Plan",yearly:"Yearly Plan",lifetime:"Lifetime Plan"};
const autoOn=()=>nativeIO?!!nativeIO.getFileName():!!fileHandle;
const autoName=()=>nativeIO?nativeIO.getFileName():autoSaveName;
let lastSaved=null;

/* ---------- storage ---------- */
function save(touch=true){
  if(touch) S.updated=new Date().toISOString();
  try{ localStorage.setItem(KEY,JSON.stringify(S)); }
  catch(e){ toast("Couldn't save — storage is full or blocked."); }
  writeExport();                                      // fire-and-forget; no-op if not set up
}
/* ---------- backup file ----------
   The file is JSON so it can be imported again on another device.
   Android: MainActivity.kt writes it to the location picked with the system "save as" screen,
   or to Expense_Backup.json in the chosen Google Drive account.
   Browsers with File System Access: written straight to the picked file. */
function backupText(){
  return JSON.stringify({app:"Login",format:1,exported:new Date().toISOString(),data:S});
}
let exportT=null;
function writeExport(){                               // called on every save(); batches quick edits
  if(!autoOn()) return;
  clearTimeout(exportT); exportT=setTimeout(flushExport,400);
}
async function flushExport(){
  clearTimeout(exportT); exportT=null;
  if(!autoOn()) return;
  if(nativeIO){ nativeIO.writeText(backupText()); return; }   // result comes back via onNativeSaved / onNativeError
  try{
    let perm=await fileHandle.queryPermission({mode:"readwrite"});
    if(perm!=="granted") perm=await fileHandle.requestPermission({mode:"readwrite"});
    if(perm!=="granted") return;
    const w=await fileHandle.createWritable();
    await w.write(backupText()); await w.close();
    lastSaved=Date.now();
  }catch(e){ /* file moved, deleted, or permission revoked — user can reconnect in Report */ }
}
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden"&&exportT) flushExport(); });
window.addEventListener("pagehide",()=>{ if(exportT) flushExport(); });

/* Called by the Android app. */
window.onNativeFile=name=>{ toast("Saving to "+name); flushExport(); if(inApp()) render(); };
/* Google Drive already holds Expense_Backup.json: ask whether to load it. */
window.onNativeDriveExists=(label,text)=>{
  let d=null; try{ d=parseBackup(text); }catch(e){}
  if(!d){ window.onNativeFile(label); return; }
  const n=d.tx.length, word=n===1?"entry":"entries";
  sheet(`<h2>Data found in Google Drive</h2>
  <p class="note">${esc(label)} already has a backup with ${n} ${word}. Do you want to load it? Yes replaces the data currently in the app. No keeps your current data and overwrites the Drive backup.</p>
  <button class="btn" id="dv-yes">Yes, load it</button>
  <button class="btn ghost" id="dv-no" style="margin-top:8px">No, keep my current data</button>`);
  $("dv-yes").addEventListener("click",()=>{
  S=d; save(false); applyTheme(); closeSheet(); render(); toast("Loaded "+n+" "+word);
  });
  $("dv-no").addEventListener("click",()=>{ closeSheet(); window.onNativeFile(label); });
};
window.onNativeSaved=()=>{ lastSaved=Date.now(); const el=$("saveStamp"); if(el) el.textContent=savedLabel(); };
window.onNativeError=msg=>toast(msg);
window.onNativeInfo=msg=>toast(msg);
window.onNativeProducts=list=>{ products=Array.isArray(list)?list:[]; if(plansOpen&&sheetEl) removeAdsSheet(false); };
window.onNativePremium=p=>{ premium=String(p||""); if(inApp()) render(); if(plansOpen&&sheetEl) removeAdsSheet(false); syncBanner(); };
/* Phone Back button (called by MainActivity.kt): close the top-most thing, one step at a time.
   Returns true if it handled the press; false means "nothing left to close" and the app asks for a second press to exit. */
window.onNativeBack=()=>{
  if(sheetEl){ closeSheet(); return true; }
  if(pageEl){ closePage(); return true; }
  if(drawerEl){ closeDrawer(); return true; }
  if(inApp()&&view!=="dash"){ view="dash"; render(); window.scrollTo(0,0); return true; }
  return false;
};
window.onNativeImport=text=>confirmImport(text);
const inApp=()=>!$("app").classList.contains("hide");
function savedLabel(){
  return lastSaved?"Last saved "+new Date(lastSaved).toLocaleTimeString(LOC(),{hour:"numeric",minute:"2-digit"}):"";
}

/* Accepts a backup file (wrapped) or the older pasted backup text (bare state). */
function parseBackup(text){
  const p=JSON.parse(text);
  const d=(p&&p.data&&Array.isArray(p.data.tx))?p.data:p;
  if(!d||!Array.isArray(d.tx)) throw new Error("bad");
  const n=Object.assign(blank(),d);
  n.cfg=Object.assign(blank().cfg,d.cfg||{});
  delete n.cfg.plan;                                  // a backup can never grant Premium
  n.auth=Object.assign(blank().auth,d.auth||{});
  n.cats=(d.cats&&d.cats.length)?d.cats:[...DEFAULT_CATS];
  n.srcs=(d.srcs&&d.srcs.length)?d.srcs:blank().srcs;
  return n;
}

function applyTheme(){
  let t=S.cfg.theme||"auto";
  if(!THEMES.some(x=>x.id===t)) t="auto";   // saved theme no longer exists
  let activeTheme = t;
  if(t==="auto"){
    const isDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    activeTheme = isDark ? "dark" : "sand";
    document.documentElement.setAttribute("data-theme", activeTheme);
  } else {
    document.documentElement.setAttribute("data-theme", t);
  }
  const bg = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim()||"#121212";
  const m=document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute("content", bg);

  const darkThemes = ["dark", "midnight", "forest", "deepsea", "amoled", "graphite", "plum", "wine", "ember", "slate", "aurora", "nord", "dracula", "solarized", "coffee", "cyber", "tealnight", "indigo", "moss", "rust", "inkblue", "charcoal", "berry", "steel", "twilight", "obsidian"];
  const isDarkTheme = darkThemes.includes(activeTheme);
  if(window.AndroidStorage && window.AndroidStorage.setStatusBarStyle){
    window.AndroidStorage.setStatusBarStyle(bg, !isDarkTheme);
  }
}

function processRecurring(){
  if(!Array.isArray(S.tx) || !S.tx.length) return;
  const nowK = mKey(today());
  let addedCount = 0;

  const recurringTx = S.tx.filter(t => t.recurring);
  recurringTx.forEach(t => {
    const tMonth = mKey(t.date);
    if (tMonth < nowK) {
      const parentId = t.recurringParent || t.id;
      const exists = S.tx.some(x => mKey(x.date) === nowK && (x.recurringParent === parentId || (x.cat === t.cat && x.type === t.type && Number(x.amt) === Number(t.amt) && x.recurring)));

      if (!exists) {
        const day = t.date.slice(8, 10);
        const newDate = `${nowK}-${day}`;
        const newRec = {
          id: uid(),
          type: t.type,
          date: newDate,
          cat: t.cat,
          amt: t.amt,
          remark: t.remark || "",
          hours: t.hours || 0,
          days: t.days || 0,
          recurring: true,
          recurringParent: parentId
        };
        S.tx.push(newRec);
        addedCount++;
      }
    }
  });

  if (addedCount > 0) {
    save(false);
  }
}

function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){
      const d=JSON.parse(raw);
      S=Object.assign(blank(),d);
      S.cfg=Object.assign(blank().cfg,d.cfg||{});
      delete S.cfg.plan;                              // premium is never read from storage
      S.auth=Object.assign(blank().auth,d.auth||{});
      S.tx=Array.isArray(d.tx)?d.tx:[];
      S.cats=(d.cats&&d.cats.length)?d.cats:[...DEFAULT_CATS];
      S.srcs=(d.srcs&&d.srcs.length)?d.srcs:blank().srcs;
      processRecurring();
    }
  }catch(e){ /* unreadable storage: start clean */ }
  applyTheme();
}

function money(n,html=true){

  const str=(Number(n)<0?"-":"")+c+s+v.toLocaleString(LOC(),{minimumFractionDigits:2,maximumFractionDigits:2});

function short(n){
  const v=Math.abs(Number(n)||0);
  const c=cur().trim(), s=c?"\u00A0":"";
  if(v>=1e6) return c+s+(v/1e6).toFixed(1)+"M";
  if(v>=1e3) return c+s+(v/1e3).toFixed(1)+"k";
  return c+s+v.toFixed(0);
}
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
const mKey=d=>String(d).slice(0,7);
function mLabel(k,long){
  const [y,m]=k.split("-").map(Number);
  return new Date(y,m-1,1).toLocaleDateString(LOC(),{month:long?"long":"short",year:"numeric"});
}
function dLabel(d){

function addMonths(k,n){
  const [y,m]=k.split("-").map(Number);
  const d=new Date(y,m-1+n,1);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");

const exp=()=>S.tx.filter(t=>t.type==="expense");

const sum=a=>a.reduce((s,t)=>s+(Number(t.amt)||0),0);
const totalFunds=()=>(Number(S.cfg.opening)||0)+sum(inc());
const totalUsed=()=>sum(exp());
const remaining=()=>totalFunds()-totalUsed();
function byMonth(type){
  const m={};
  S.tx.filter(t=>t.type===type).forEach(t=>{const k=mKey(t.date);m[k]=(m[k]||0)+(Number(t.amt)||0);});
  return m;
}
function monthsBack(n,type,offset=0){
  const now=mKey(today()), out=[], m=byMonth(type);
  for(let i=n-1+offset;i>=offset;i--){const k=addMonths(now,-i);out.push({k,total:m[k]||0});}
  return out;
}
/* Next-month forecast: weighted average of the last 3 months (50/30/20,
   newest heaviest), nudged by half the linear trend across them. */
function forecast(){
  const last=monthsBack(3,"expense").map(x=>x.total);
  const seen=last.filter(v=>v>0).length;
  if(!seen) return 0;
  if(seen===1) return Math.max(...last);
  const w=last[0]*0.2+last[1]*0.3+last[2]*0.5;
  const mean=(last[0]+last[1]+last[2])/3;
  const slope=((0-1)*(last[0]-mean)+(2-1)*(last[2]-mean))/2;
  return Math.max(0,w+slope*0.5);
}

/* ---------- optional 4-digit password ---------- */
async function hash(s){
  try{
    const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("lg:"+s));
    return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
  }catch(e){
    let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))|0;
    return "f"+(h>>>0).toString(16);
  }
}

/* ---------- swipe navigation ---------- */
let touchStartX = 0;
let touchStartY = 0;

document.addEventListener("touchstart", e => {
  if (e.touches.length === 1 && !sheetEl && !pageEl && !drawerEl) {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }
}, {passive: true});

document.addEventListener("touchmove", e => {
  if (e.touches.length === 1 && !sheetEl && !pageEl && !drawerEl) {
    const target = e.target;
    if (target.closest("input, select, textarea, button, canvas, svg")) return;

    const deltaX = e.touches[0].clientX - touchStartX;
    const deltaY = e.touches[0].clientY - touchStartY;

    if (Math.abs(deltaX) > 15 && Math.abs(deltaX) > Math.abs(deltaY) * 1.5) {
      if (e.cancelable) {
        e.preventDefault();
      }
    }
  }
}, {passive: false});

document.addEventListener("touchend", e => {
  if (e.changedTouches.length === 1 && !sheetEl && !pageEl && !drawerEl) {
    const target = e.target;
    if (target.closest("input, select, textarea, button")) return;

    const deltaX = e.changedTouches[0].clientX - touchStartX;
    const deltaY = e.changedTouches[0].clientY - touchStartY;

    if (Math.abs(deltaX) > 50 && Math.abs(deltaX) > Math.abs(deltaY) * 1.5) {
      const order = ["dash", "expenses", "income", "report"];
      const currentIndex = order.indexOf(view);
      if (currentIndex !== -1) {
        if (deltaX < 0 && currentIndex < order.length - 1) {
          view = order[currentIndex + 1];
          render();
          window.scrollTo(0, 0);
        } else if (deltaX > 0 && currentIndex > 0) {
          view = order[currentIndex - 1];
          render();
          window.scrollTo(0, 0);
        }
      }
    }
  }
}, {passive: true});

/* Monthly spend for the runway: the figure the user typed, otherwise the 3-month average. */
function burnRate(){
  const typed=Number(S.cfg.burn)||0;
  return typed>0?typed:avg3();
}
let chartOffset = 0;
function renderDash(){
  const tf=totalFunds(), used=totalUsed(), rem=remaining(), burn=burnRate();
  const months=burn>0?rem/burn:null;
  const nowK=mKey(today()), thisMonth=byMonth("expense")[nowK]||0;
  const last3=monthsBack(3,"expense", chartOffset), pred=forecast();
  const showForecast = (chartOffset === 0);

  const runway = months===null
    ? `<div class="big">Not set</div><div class="lbl">Add a few expenses, or set your monthly spend in ⋮, to see the runway</div>`
    : `<div class="big num">${(months<0?0:months).toFixed(1)} <span style="font-size:18px;font-weight:500;color:var(--muted)">months</span></div>
       <div class="lbl">${
         months>0?" · lasts upto "+mLabel(addMonths(nowK,Math.floor(months)),false):""}</div>`;

  $("view").innerHTML=`
  <div class="card">
    <div class="lbl">Funds remaining</div>
    <div class="big num">${money(rem)}</div>
    <div class="split">
      <div><div class="lbl">Total funds</div><div class="mid num in">${money(tf)}</div></div>
      <div><div class="lbl">Funds used</div><div class="mid num out">${money(used)}</div></div>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <div class="lbl">Remaining months</div>
      <button class="dots" id="moneyDots" title="Money settings" aria-label="Money settings">&#8942;</button>
    </div>
    ${runway}
  </div>

  <div class="card" id="chartCard">
    <div class="row">
      <div class="lbl">Spending history</div>
      <div style="display:flex;gap:4px;align-items:center">
        <button class="dots" id="chartPrev" title="Previous months" aria-label="Previous months">&lsaquo;</button>
        <button class="dots" id="chartNext" title="Recent months" aria-label="Recent months" ${chartOffset===0?"disabled style='opacity:.4'":""}>&rsaquo;</button>
      </div>
    </div>
    ${barChart(last3, showForecast ? pred : 0, showForecast)}
    <div class="lbl" style="margin-top:12px">
      ${showForecast && pred>0
        ? `Next month is forecast at <b class="num">${money(pred)}</b>`
        : `Swipe the chart right/left or use arrows to view past months.`}
    </div>
  </div>`;

  $("moneyDots").addEventListener("click",moneySheet);
  $("chartPrev").addEventListener("click",()=>{ chartOffset++; renderDash(); });
  $("chartNext").addEventListener("click",()=>{ chartOffset=Math.max(0,chartOffset-1); renderDash(); });

  const cardEl=$("chartCard");
  let cStartX=0;
  cardEl.addEventListener("touchstart",e=>{ if(e.touches.length===1) cStartX=e.touches[0].clientX; },{passive:true});
  cardEl.addEventListener("touchend",e=>{
    if(e.changedTouches.length===1){
      const dx=e.changedTouches[0].clientX-cStartX;
      if(Math.abs(dx)>40){
        if(dx>0){ chartOffset++; renderDash(); }
        else { chartOffset=Math.max(0,chartOffset-1); renderDash(); }
      }
    }
  },{passive:true});
}

function barChart(last3,pred,showForecast){
  const bars=[...last3.map(m=>({label:mLabel(m.k,false).split(" ")[0],v:m.total,pred:false}))];
  if(showForecast){
    bars.push({label:mLabel(addMonths(mKey(today()),1),false).split(" ")[0],v:pred,pred:true});
  }
  const max=Math.max(...bars.map(b=>b.v),1);
  const W=340,H=150,pad=22,bw=showForecast?52:68,gap=showForecast?(W-pad*2-bw*4)/3:(W-pad*2-bw*3)/2;
  const body=bars.map((b,i)=>{
    const h=Math.max(3,(b.v/max)*(H-52));
    const x=pad+i*(bw+gap), y=H-30-h;
    return `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="6" fill="${b.pred?"url(#hatch)":"var(--out)"}"${
      b.pred?' stroke="var(--out)" stroke-width="1.2" stroke-dasharray="3 3"':''}/>
      <text x="${x+bw/2}" y="${y-7}" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--ink)">${b.v?esc(short(b.v)):"—"}</text>
      <text x="${x+bw/2}" y="${H-10}" text-anchor="middle" font-size="11.5" fill="var(--muted)">${esc(b.label)}</text>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" style="margin-top:10px;display:block" role="img" aria-label="Monthly spending history">
    <defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">

/* ===================== REPORT ===================== */
function yearStats(y){
  const rows=S.tx.filter(t=>t.date.slice(0,4)===String(y));
  const incomeRows=rows.filter(t=>t.type==="income");
  return{
    hours:incomeRows.reduce((s,t)=>s+(Number(t.hours)||0),0),
    days:incomeRows.reduce((s,t)=>s+(Number(t.days)||0),0),
    earned:sum(incomeRows),
    spent:sum(rows.filter(t=>t.type==="expense"))
  };
}
let reportYear = new Date().getFullYear();
let reportPieYear = "all";

function pieChart(cats, total){
  if(!cats.length || !total) return "";
  const colors = ["#B5702A", "#2F6F4E", "#1F6FA8", "#B23A5E", "#5E7F2E", "#6FA8F0", "#B48CF0", "#F0A45A", "#EE7B70", "#5EEAD4"];
  const cx = 100, cy = 100, r = 70, innerR = 45;

  if(cats.length === 1 || cats[0][1] >= total * 0.999){
    return `<svg viewBox="0 0 200 200" width="160" height="160" style="display:block;margin:12px auto" role="img" aria-label="Pie chart">
      <circle cx="${cx}" cy="${cy}" r="${(r + innerR)/2}" fill="none" stroke="${colors[0]}" stroke-width="${r - innerR}"/>
    </svg>`;
  }

  let startAngle = 0;
  const rad = deg => (deg - 90) * Math.PI / 180;

  const slices = cats.map(([c, v], idx) => {
    const fraction = v / total;
    if(fraction <= 0) return "";
    const angle = fraction * 360;
    const endAngle = startAngle + angle;

    const x1 = cx + r * Math.cos(rad(startAngle));
    const y1 = cy + r * Math.sin(rad(startAngle));
    const x2 = cx + r * Math.cos(rad(endAngle));
    const y2 = cy + r * Math.sin(rad(endAngle));

    const ix1 = cx + innerR * Math.cos(rad(endAngle));
    const iy1 = cy + innerR * Math.sin(rad(endAngle));
    const ix2 = cx + innerR * Math.cos(rad(startAngle));
    const iy2 = cy + innerR * Math.sin(rad(startAngle));

    const largeArc = angle > 180 ? 1 : 0;
    const color = colors[idx % colors.length];

    const d = `M ${x1} ${y1} A ${r} ${r} 0 ${largeArc} 1 ${x2} ${y2} L ${ix1} ${iy1} A ${innerR} ${innerR} 0 ${largeArc} 0 ${ix2} ${iy2} Z`;

    startAngle = endAngle;
    return `<path d="${d}" fill="${color}"><title>${esc(c)}: ${money(v)}</title></path>`;
  }).join("");

  return `<svg viewBox="0 0 200 200" width="160" height="160" style="display:block;margin:12px auto" role="img" aria-label="Where the money went pie chart">
    ${slices}
  </svg>`;
}

    ${!ys.hours&&!ys.days?`<div class="lbl" style="margin-top:6px">Add hours or days when you log income to see work totals here.</div>`:""}
  </div>

  <div class="card">
    <div class="lbl">earned and spent, all</div>
    <div class="split" style="margin-top:8px;padding-top:0;border:0">
      <div><div class="lbl">Earned</div><div class="mid num earned">${money(i)}</div></div>
      <div><div class="lbl">Spent</div><div class="mid num spent">${money(e)}</div></div>
    </div>
    <div class="bar-track" style="height:9px;margin-top:14px"><div class="bar-fill" style="width:${Math.min(100,rate)}%"></div></div>
    <div class="lbl" style="margin-top:7px">${i>0?`You've spent ${rate.toFixed(0)}% of everything that you earned.`:`Add your funds in Dashboard → ⋮ to see this.`}</div>
  </div>

  <div class="card">
    <div class="lbl">Last six months</div>
    ${months.every(x=>!x.total)?`<div class="lbl" style="margin-top:10px">Nothing recorded yet.</div>`:
      months.map(x=>`<div style="margin-top:11px">
        <div class="row"><span style="font-size:14px">${mLabel(x.k,false)}</span><span class="amt num">${money(x.total)}</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.max(2,(x.total/maxv)*100)}%"></div></div>
      </div>`).join("")}
  </div>

  <div class="card">
    <div class="row">
      <div class="lbl">Where the money went${pieYear === "all" ? ", all time" : ", " + pieYear}</div>
      <div style="display:flex;gap:4px;align-items:center">
        <button class="dots" id="piePrev" title="Previous" aria-label="Previous">&lsaquo;</button>
        <span style="font-weight:600;font-size:14px;padding:0 4px">${pieYear === "all" ? "All" : pieYear}</span>
        <button class="dots" id="pieNext" title="Next" aria-label="Next" ${pieYear === "all" ? "disabled style='opacity:.4'" : ""}>&rsaquo;</button>
      </div>
    </div>
    ${pieCats.length ? pieChart(pieCats, pieTotal) : ""}
    ${pieCats.length?pieCats.map(([c,v], idx)=>`<div style="margin-top:11px">
      <div class="row">
        <span style="font-size:14px;display:flex;align-items:center;gap:6px">

          ${esc(c)}
        </span>
        <span class="amt num">${money(v)} <span class="lbl">${pieTotal > 0 ? (v/pieTotal*100).toFixed(0) : 0}%</span></span>
      </div>

  $("yrPrev").addEventListener("click",()=>{ reportYear--; renderReport(); });

}

/* type is always fixed by where the sheet was opened from — Expenses' fab
   only ever makes an expense, Income's fab only ever makes income, and

function entrySheet(edit,presetType,presetMonth,presetCat){

  const t=edit||{
    id:null,type,
    date:presetMonth?(presetMonth===mKey(today())?today():presetMonth+"-01"):today(),
    cat:presetCat||(type==="income"?S.srcs[0]:"Grocery"),

  <div class="field"><label for="e-date">Date</label><input id="e-date" type="date" value="${esc(t.date)}"></div>
  <div class="field" id="catWrap"></div>
  <div class="field"><label for="e-amt">Amount</label>

  ${type==="income"?`
  <div style="display:flex;gap:10px">

      <input id="e-hours" type="number" inputmode="decimal" step="0.25" min="0" value="${t.hours?t.hours:""}"></div>
    <div class="field" style="flex:1"><label for="e-days">Days worked <span class="lbl">— opt</span></label>
      <input id="e-days" type="number" inputmode="decimal" step="0.5" min="0" value="${t.days?t.days:""}"></div>
  </div>`:""}
  <div class="field"><label for="e-rem">Note <span class="lbl">— optional</span></label>
    <input id="e-rem" placeholder="${type==="income"?"e.g. September salary":"where exactly it went"}" value="${esc(t.remark||"")}"></div>
  <div class="field" style="margin-top:10px">
    <label>Attachment <span class="lbl">— optional (receipt, bill)</span></label>
    <div id="e-file-preview"></div>
    <input id="e-file-input" type="file" accept="image/*,.pdf,.doc,.docx,.txt" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none">
    <button class="btn ghost" id="e-file-btn" type="button" style="display:flex;align-items:center;justify-content:center;gap:8px;padding:10px;width:100%;margin-top:4px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
      <span id="e-file-btn-text">Attach receipt or file</span>
    </button>
  </div>
  <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 0;margin:8px 0 12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)">
    <div>
      <div style="font-size:14px;font-weight:600">Recurring monthly</div>
      <div class="lbl">Auto-repeat this entry every month</div>
    </div>
    <span class="switch${t.recurring?" on":""}" id="e-rec-switch" role="switch" aria-checked="${!!t.recurring}" style="cursor:pointer"></span>
  </div>
  <div class="err" id="e-err"></div>

    ${edit?`<button class="btn danger" id="e-del" style="margin-top:8px">Delete this entry</button>`:""}`,"bottom");

  function drawCat(){
    const list=type==="expense"?S.cats:S.srcs;
    const sel=list.includes(t.cat)?t.cat:list[0];
    $("catWrap").innerHTML=`<label for="e-cat">${type==="expense"?"Category":"Source"}</label>
      <select id="e-cat">${list.map(c=>`<option${c===sel?" selected":""}>${esc(c)}</option>`).join("")}
      <option value="__new">+ Add ${type==="expense"?"category":"source"}…</option></select>
      <div id="newCatRow" class="hide" style="margin-top:8px;display:flex;gap:8px">
        <input id="e-newcat" placeholder="${type==="expense"?"Category":"Source"} name" style="flex:1">
        <button class="btn ghost" id="e-newcat-add" type="button" style="width:auto;padding:11px 16px;flex:none">Add</button>
      </div>`;
    const newRow=$("newCatRow");
    $("e-cat").addEventListener("change",ev=>{
      if(ev.target.value==="__new"){
        newRow.classList.remove("hide");
        $("e-newcat").value=""; $("e-newcat").focus();
      } else {
        newRow.classList.add("hide");
        t.cat=ev.target.value;
      }
    });
    function commitNew(){
      const name=$("e-newcat").value.trim().slice(0,28);
      if(!name){ $("e-newcat").focus(); return; }
      const l=type==="expense"?S.cats:S.srcs;
      if(!l.some(c=>c.toLowerCase()===name.toLowerCase())) l.push(name);
      t.cat=name; save(false);
      drawCat();
    }
    $("e-newcat-add").addEventListener("click",commitNew);
    $("e-newcat").addEventListener("keydown",ev=>{ if(ev.key==="Enter"){ ev.preventDefault(); commitNew(); } });
  }
  drawCat();

  let isRec = !!t.recurring;
  const recSwitch = $("e-rec-switch");
  if(recSwitch){
    recSwitch.addEventListener("click", () => {
      isRec = !isRec;
      recSwitch.classList.toggle("on", isRec);
      recSwitch.setAttribute("aria-checked", String(isRec));
    });
  }

  let currentFile = (t && t.file) ? Object.assign({}, t.file) : null;

  function renderFilePreview(){
    const prev = $("e-file-preview");
    const btnText = $("e-file-btn-text");
    if(!prev) return;
    if(currentFile && currentFile.data){
      const isImg = currentFile.type && currentFile.type.startsWith("image/");
      prev.innerHTML = `
        <div style="display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:6px">

          <div style="flex:1;min-width:0;text-align:left">
            <div style="font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(currentFile.name||"Attachment")}</div>
            <div class="lbl">Attached</div>
          </div>
          <button type="button" class="dots" id="e-file-rem" title="Remove attachment" aria-label="Remove attachment" style="color:var(--danger);width:32px;height:32px;font-weight:bold">&times;</button>
        </div>`;
      if(btnText) btnText.textContent = "Change attached file";
      const remBtn = $("e-file-rem");
      if(remBtn){
        remBtn.addEventListener("click", () => {
          currentFile = null;
          $("e-file-input").value = "";
          renderFilePreview();
        });
      }
    } else {
      prev.innerHTML = "";
      if(btnText) btnText.textContent = "Attach receipt or file";
    }
  }

  renderFilePreview();

  window.onCameraPermissionGranted = function(){
    $("e-file-input").click();
  };

  $("e-file-btn").addEventListener("click", (e) => {
    e.preventDefault();
    if(nativeIO && typeof nativeIO.requestCameraPermissionAndPick === "function"){
      nativeIO.requestCameraPermissionAndPick();
    } else {
      $("e-file-input").click();
    }
  });

  $("e-file-input").addEventListener("change", function(){
    const file = this.files && this.files[0];
    if(!file) return;
    if(file.type && file.type.startsWith("image/")){
      const reader = new FileReader();
      reader.onload = function(e){
        const img = new Image();
        img.onload = function(){
          const maxDim = 1200;
          let w = img.width, h = img.height;
          if(w > maxDim || h > maxDim){
            if(w > h){ h = Math.round((h * maxDim) / w); w = maxDim; }
            else { w = Math.round((w * maxDim) / h); h = maxDim; }
          }
          const canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, w, h);
          currentFile = { name: file.name, type: "image/jpeg", data: canvas.toDataURL("image/jpeg", 0.82) };
          renderFilePreview();
        };
        img.onerror = function(){
          currentFile = { name: file.name, type: file.type, data: e.target.result };
          renderFilePreview();
        };

/* ===================== ad-free days ===================== */
/* Watching one ad switches ads off for 7 days. The bar shows the days that are left; at 0 the ads come back. */
const AD_KEY="Login.adfree", AD_DAYS=6, DAY=864e5;
/* In the Android app the timer lives in MainActivity.kt (uptime clock, immune to date changes).
   The localStorage version below is only the fallback for a plain browser. */
const hasNativeAd=()=>!!(nativeIO&&typeof nativeIO.getAdFreeMs==="function");
function adLeftMs(){
  if(hasNativeAd()){ try{ return Math.max(0,Math.min(Number(nativeIO.getAdFreeMs())||0,AD_DAYS*DAY)); }catch(e){ return 0; } }
  try{ const val=Number(localStorage.getItem(AD_KEY))||0; return Math.max(0,Math.min(val-Date.now(),AD_DAYS*DAY)); }catch(e){ return 0; }
}
const adUntil=()=>Date.now()+adLeftMs();
const adFree=()=> {
  if (getActivePlan()) return true;
  return adUntil() > Date.now();
};
const adDaysLeft=()=>Math.max(0,Math.ceil(adLeftMs()/DAY));
let currentAdCallback = null;

function grantAdFree(){
  try{
    if(hasNativeAd()) nativeIO.addAdFreeMs(3*DAY,AD_DAYS*DAY);
    else{
      const now = Date.now();
      const current = adUntil();
      const base = current > now ? current : now;
      const next = Math.min(base + 3 * DAY, now + AD_DAYS * DAY);
      localStorage.setItem(AD_KEY, String(next));
    }
  }catch(e){}
  closeSheet();
  if(drawerEl) fillDrawer();
  if(pageEl) fillPage();
  syncBanner();
  syncNativeAd();
  toast("Ads are off for 3 more days (up to 6 days total)");
}

window.onAdRewarded = function(){
  if(currentAdCallback){
    const cb = currentAdCallback;
    currentAdCallback = null;
    closeSheet();
    cb();
  } else {
    grantAdFree();
  }
};

<fonts count="8">${fontX(0,11,"FF182019")}${fontX(1,11,"FFFFFFFF")}${fontX(1,11,"FF182019")}${fontX(1,18,"FFFFFFFF")}${fontX(1,11,"FF2F6F4E")}${fontX(1,11,"FFB5702A")}${fontX(0,10,"FFC9D3CB")}${fontX(1,13,"FF182019")}</fonts>
<fills count="5"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill>${fillX("FF182019")}${fillX("FFEDF0EA")}${fillX("FF2F6F4E")}</fills>
<borders count="3"><border><left/><right/><top/><bottom/><diagonal/></border><border><left/><right/><top/><bottom style="thin"><color rgb="FFDCE1D8"/></bottom><diagonal/></border><border><left/><right/><top style="thin"><color rgb="FF182019"/></top><bottom style="thin"><color rgb="FF182019"/></bottom><diagonal/></border></borders>
<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>
<cellXfs count="${XF.length}">${xfX}</cellXfs>
<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>
</styleSheet>`;

  /* ---------- sheet builder ---------- */
  const C=(v,s)=>({v,s:ST[s]});
  function sheetXml(o){
    const rows=o.rows, nc=o.widths.length, heights=o.heights||{}, merges=o.merges||[];
    const cell=(c,r,i)=>{
      if(c==null) return "";
      const ref=colN(i)+(r+1), s=c.s!=null?` s="${c.s}"`:"";
      if(c.v===undefined||c.v===null||c.v==="") return `<c r="${ref}"${s}/>`;
      if(typeof c.v==="number") return `<c r="${ref}"${s}><v>${Number.isFinite(c.v)?c.v:0}</v></c>`;
      return `<c r="${ref}"${s} t="inlineStr"><is><t xml:space="preserve">${xe(c.v)}</t></is></c>`;
    };
    const data=rows.map((r,ri)=>`<row r="${ri+1}"${heights[ri]?` ht="${heights[ri]}" customHeight="1"`:""}>${r.map((c,i)=>cell(c,ri,i)).join("")}</row>`).join("");
    const pane=o.freeze?`<pane ySplit="${o.freeze}" topLeftCell="A${o.freeze+1}" activePane="bottomLeft" state="frozen"/><selection pane="bottomLeft" activeCell="A${o.freeze+1}" sqref="A${o.freeze+1}"/>`:"";
    return H+`<worksheet xmlns="${M}"><sheetPr><pageSetUpPr fitToPage="1"/></sheetPr><dimension ref="A1:${colN(nc-1)}${rows.length}"/>`
      +`<sheetViews><sheetView${o.first?' tabSelected="1"':""} showGridLines="0" workbookViewId="0">${pane}</sheetView></sheetViews>`
      +`<sheetFormatPr defaultRowHeight="15"/>`
      +`<cols>${o.widths.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join("")}</cols>`
      +`<sheetData>${data}</sheetData>`
      +(o.filter?`<autoFilter ref="${o.filter}"/>`:"")
      +(merges.length?`<mergeCells count="${merges.length}">${merges.map(m=>`<mergeCell ref="${m}"/>`).join("")}</mergeCells>`:"")
      +(o.extra||"")
      +`<pageMargins left="0.5" right="0.5" top="0.6" bottom="0.6" header="0.3" footer="0.3"/>`
      +`<pageSetup paperSize="9" orientation="${o.land?"landscape":"portrait"}" fitToWidth="1" fitToHeight="0"/></worksheet>`;
  }
  /* title banner + header row + data + optional total row */
  function tableSheet({title,sub,head,widths,data,total,extra}){
    const nc=head.length, rows=[], heights={}, merges=[];
    const band=(t,s,i)=>{ const r=[C(t,s)]; for(let k=1;k<nc;k++) r.push(C("",s)); rows.push(r); merges.push(`A${i+1}:${colN(nc-1)}${i+1}`); };
    band(title,"title",0); band(sub,"sub",1); rows.push([]);
    rows.push(head.map(h=>C(h,"head")));
    data.forEach(r=>rows.push(r)); if(total) rows.push(total);
    heights[0]=36; heights[1]=20; heights[3]=26;
    for(let i=4;i<rows.length;i++) heights[i]=20;
    return sheetXml({rows,widths,heights,merges,freeze:4,extra});
  }

  /* ---------- data ---------- */
  const ser=d=>{ const p=String(d).split("-").map(Number); if(p.length<3||p.some(isNaN)) return null; return Math.round(Date.UTC(p[0],p[1]-1,p[2])/864e5)+25569; };
  const sorted=S.tx.slice().sort((a,b)=>a.date.localeCompare(b.date)||String(a.id).localeCompare(String(b.id)));
  const nowK=mKey(today()), tf=totalFunds(), used=totalUsed(), rem=remaining(), burn=burnRate();
  const runway=burn>0?rem/burn:null;
  const im=byMonth("income"), em=byMonth("expense");
  const gen=new Date().toLocaleString(LOC(),{day:"numeric",month:"long",year:"numeric",hour:"numeric",minute:"2-digit"});
  const first=sorted.length?dLabel(sorted[0].date):"—", last=sorted.length?dLabel(sorted[sorted.length-1].date):"—";
  const n=sorted.length;
  const subLine=`Generated ${gen}  ·  ${n} transaction${n===1?"":"s"}  ·  ${first} to ${last}`;
  const sheets=[];

  /* 1) Transactions — MUST stay first with these exact headers: the Excel import reads this sheet */
  {
    const head=["Date","Type","Category","Amount","Hours","Days","Note","Recurring","Attachment"];
    const rows=[head.map(h=>C(h,"head"))], heights={0:26};
    sorted.forEach((t,i)=>{
      const isI=t.type==="income", d=ser(t.date);
      rows.push([
        d==null?C(t.date,"txt"):C(d,"date"),
        C(isI?"Income":"Expense",isI?"incT":"expT"),
        C(t.cat,"txt"),
        C(Number(t.amt)||0,isI?"inc":"exp"),
        C(t.hours||"","num"), C(t.days||"","num"),
        C(t.remark||"","wrap"),
        C(t.recurring?"Yes":"","txt"),
        C(t.file&&t.file.name?t.file.name:"","txt")
      ]);
      if((t.remark||"").length<=45) heights[i+1]=20;     // long notes wrap and auto-size
    });
    sheets.push({name:"Transactions",xml:sheetXml({rows,heights,widths:[14,12,22,16,10,10,46,12,28],freeze:1,filter:`A1:I${n+1}`,land:true})});
  }

  /* 2) Summary */
  {
    const rows=[], heights={0:36,1:20,2:20,4:26}, merges=["A1:B1","A2:B2","A3:B3"];
    const band=(t,s)=>rows.push([C(t,s),C("",s)]);
    band(`Expense Tracker · Jasin Creations`, "small");
    band("Expense Report","title");
    band(`Generated ${gen}`,"sub");
    band(`${n} transaction${n===1?"":"s"}  ·  ${first} to ${last}`,"sub");
    rows.push([]);
    rows.push([C("Metric","head"),C("Value","head")]);
    [
      ["Funds remaining",rem,"big"],
      ["Total funds",tf,"big"],
      ["Funds used",used,"big"],
      ["Opening balance",Number(S.cfg.opening)||0,"big"],
      ["Income recorded",sum(inc()),"big"],
      [`Spent in ${mLabel(nowK,true)}`,em[nowK]||0,"big"],
      ["Share of funds spent",tf>0?used/tf:0,"pctB"],
      ["Runway",runway===null?"Not set":(runway<0?0:runway).toFixed(1)+" months","big"]
    ].forEach(([l,v,s])=>{ heights[rows.length]=24; rows.push([C(l,"lab"),C(v,s)]); });
    sheets.push({name:"Summary",xml:sheetXml({rows,heights,merges,widths:[34,26],first:true})});
  }

  /* 3) Yearly */
  {
    const years=[...new Set(S.tx.map(t=>t.date.slice(0,4)))].sort().reverse();
    let th=0,td=0,te=0,ts=0;
    const data=years.map(y=>{
      const s=yearStats(y); th+=s.hours; td+=s.days; te+=s.earned; ts+=s.spent;
      return [C(y,"bold"),C(s.hours||"","num"),C(s.days||"","num"),C(s.earned,"inc"),C(s.spent,"exp"),C(s.earned-s.spent,"money")];
    });
    sheets.push({name:"Yearly",xml:tableSheet({
      title:"Yearly summary",sub:"Hours and days come from the income entries",
      head:["Year","Hours worked","Days worked","Earned","Spent","Net"],
      widths:[14,16,16,18,18,18],data,
      total:[C("Total","totL"),C(th||"","totN"),C(td||"","totN"),C(te,"totM"),C(ts,"totM"),C(te-ts,"totM")]
    })});
  }

  /* 4) Monthly */
  {
    const keys=[...new Set([...Object.keys(im),...Object.keys(em)])].sort().reverse();
    const cnt={}; S.tx.forEach(t=>{ const k=mKey(t.date); cnt[k]=(cnt[k]||0)+1; });
    let ti=0,te=0,tc=0;
    const data=keys.map(k=>{
      const i=im[k]||0, e=em[k]||0; ti+=i; te+=e; tc+=cnt[k]||0;
      return [C(ser(k+"-01"),"mon"),C(i,"inc"),C(e,"exp"),C(i-e,"money"),C(cnt[k]||0,"num")];
    });
    sheets.push({name:"Monthly",xml:tableSheet({
      title:"Monthly summary",sub:"Income, expenses and net for every month with entries",
      head:["Month","Income","Expenses","Net","Entries"],
      widths:[22,18,18,18,12],data,
      total:[C("Total","totL"),C(ti,"totM"),C(te,"totM"),C(ti-te,"totM"),C(tc,"totN")]
    })});
  }

  /* 5) Categories (only when there are expenses) */
  {
    const ct={}, cc={};
    exp().forEach(t=>{ ct[t.cat]=(ct[t.cat]||0)+Number(t.amt); cc[t.cat]=(cc[t.cat]||0)+1; });
    const cats=Object.entries(ct).sort((a,b)=>b[1]-a[1]);
    if(cats.length){
      const data=cats.map(([c,v])=>[C(c,"bold"),C(v,"exp"),C(used>0?v/used:0,"pct"),C(cc[c],"num")]);
      const bar=`<conditionalFormatting sqref="C5:C${4+cats.length}"><cfRule type="dataBar" priority="1"><dataBar><cfvo type="num" val="0"/><cfvo type="max"/><color rgb="FFB5702A"/></dataBar></cfRule></conditionalFormatting>`;
      sheets.push({name:"Categories",xml:tableSheet({
        title:"Spending by category",sub:"Biggest category first",
        head:["Category","Amount","Share","Entries"],
        widths:[26,18,16,12],data,extra:bar,
        total:[C("Total","totL"),C(used,"totM"),C(used>0?1:0,"totP"),C(exp().length,"totN")]
      })});
    }
  }

  /* ---------- package ---------- */
  const sn=sheets.length;
  const order=["Summary","Categories","Yearly","Monthly","Transactions"];
  const tabs=order.map(nm=>sheets.findIndex(s=>s.name===nm)).filter(i=>i>=0);
  return zipStore([
    f("[Content_Types].xml",H+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'+sheets.map((s,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("")+'</Types>'),
    f("_rels/.rels",H+`<Relationships xmlns="${PR}"><Relationship Id="rId1" Type="${R}/officeDocument" Target="xl/workbook.xml"/></Relationships>`),
    f("xl/workbook.xml",H+`<workbook xmlns="${M}" xmlns:r="${R}"><sheets>${tabs.map(i=>`<sheet name="${sheets[i].name}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join("")}</sheets></workbook>`),
    f("xl/_rels/workbook.xml.rels",H+`<Relationships xmlns="${PR}">${sheets.map((s,i)=>`<Relationship Id="rId${i+1}" Type="${R}/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join("")}<Relationship Id="rId${sn+1}" Type="${R}/styles" Target="styles.xml"/></Relationships>`),
    f("xl/styles.xml",stylesXml),
    ...sheets.map((s,i)=>f(`xl/worksheets/sheet${i+1}.xml`,s.xml))
  ]);
}

function buildReportHtml(){
  const m=s=>money(s,false);
  const nowK=mKey(today());
  const tf=totalFunds(), used=totalUsed(), rem=remaining(), burn=burnRate();
  const months=burn>0?rem/burn:null;
  const incTot=sum(inc());
  const rate=tf>0?(used/tf)*100:0;
  const sorted=S.tx.slice().sort((a,b)=>a.date.localeCompare(b.date)||String(a.id).localeCompare(String(b.id)));

  // monthly table
  const im=byMonth("income"), em=byMonth("expense");
  const keys=[...new Set([...Object.keys(im),...Object.keys(em)])].sort().reverse();
  const monthRows=keys.map(k=>{
    const i=im[k]||0,e=em[k]||0,n=i-e;
    return `<tr><td>${esc(mLabel(k,true))}</td><td class="r in">${m(i)}</td><td class="r out">${m(e)}</td><td class="r ${n<0?"neg":"in"}">${m(n)}</td></tr>`;
  }).join("");

  // yearly table
  const years=[...new Set(S.tx.map(t=>t.date.slice(0,4)))].sort().reverse();
  const yearRows=years.map(y=>{
    const s=yearStats(y);
    return `<tr><td>${y}</td><td class="r">${s.hours?s.hours.toLocaleString()+" h":"—"}</td><td class="r">${s.days?s.days.toLocaleString()+" d":"—"}</td><td class="r in">${m(s.earned)}</td><td class="r out">${m(s.spent)}</td></tr>`;
  }).join("");

  // category breakdown
  const ct={}; exp().forEach(t=>ct[t.cat]=(ct[t.cat]||0)+Number(t.amt));
  const cats=Object.entries(ct).sort((a,b)=>b[1]-a[1]);
  const colors=["#B5702A","#2F6F4E","#1F6FA8","#B23A5E","#5E7F2E","#6FA8F0","#B48CF0","#F0A45A","#EE7B70","#5EEAD4"];
  const catRows=cats.map(([c,v],i)=>{
    const p=used>0?v/used*100:0;
    return `<tr><td><span class="dot" style="background:${colors[i%colors.length]}"></span>${esc(c)}</td>
      <td style="width:38%"><div class="bt"><div class="bf" style="width:${Math.max(2,p)}%;background:${colors[i%colors.length]}"></div></div></td>
      <td class="r">${m(v)}</td><td class="r muted">${p.toFixed(1)}%</td></tr>`;
  }).join("");

  // all transactions
  const txRows=sorted.map(t=>{
    const isI=t.type==="income";
    const extra=[t.hours?t.hours+"h":"",t.days?t.days+"d":"",t.recurring?"recurring":""].filter(Boolean).join(" · ");
    return `<tr><td class="nw">${esc(dLabel(t.date))}</td>
      <td><span class="pill ${isI?"pi":"po"}">${isI?"Income":"Expense"}</span></td>
      <td>${esc(t.cat)}</td>
      <td class="muted">${esc(t.remark||"")}${extra?`<div class="sm">${esc(extra)}</div>`:""}</td>
      <td class="r nw ${isI?"in":"out"}">${isI?"+":"−"} ${m(t.amt)}</td></tr>`;
  }).join("");

  const gen=new Date().toLocaleString(LOC(),{day:"numeric",month:"long",year:"numeric",hour:"numeric",minute:"2-digit"});
  const first=sorted[0]?dLabel(sorted[0].date):"—", last=sorted.length?dLabel(sorted[sorted.length-1].date):"—";

  return `<!DOCTYPE html><html><head><meta charset="utf-8"><title>Expense Report</title><style>
  @page{size:A4;margin:14mm}
  *{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{margin:0;font-family:Roboto,Arial,Helvetica,sans-serif;color:#182019;font-size:12px;line-height:1.45}
  .hd{background:#182019;color:#fff;border-radius:10px;padding:20px 22px;margin-bottom:16px}
  .hd h1{margin:0;font-size:24px;letter-spacing:-.3px}
  .hd p{margin:4px 0 0;color:#c9d3cb;font-size:12px}
  h2{font-size:14px;margin:20px 0 8px;padding-bottom:5px;border-bottom:2px solid #2F6F4E;color:#182019;page-break-after:avoid}
  .grid{display:flex;flex-wrap:wrap;gap:10px}
  .box{flex:1 1 30%;min-width:150px;border:1px solid #DCE1D8;border-radius:10px;padding:11px 13px;background:#F5F7F2;page-break-inside:avoid}
  .box .l{font-size:10.5px;color:#69736B;text-transform:uppercase;letter-spacing:.5px}
  .box .v{font-size:19px;font-weight:700;margin-top:3px}
  table{width:100%;border-collapse:collapse;margin-top:4px}
  th{background:#EDF0EA;text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:#69736B;padding:7px 8px;border-bottom:1px solid #DCE1D8}
  td{padding:6px 8px;border-bottom:1px solid #E8ECE4;vertical-align:top}
  thead{display:table-header-group} tr{page-break-inside:avoid}
  tbody tr:nth-child(even) td{background:#FAFBF8}
  .r{text-align:right} .nw{white-space:nowrap}
  .in{color:#2F6F4E;font-weight:600} .out{color:#B5702A;font-weight:600} .neg{color:#A33A2F;font-weight:600}
  .muted{color:#69736B} .sm{font-size:10px;color:#8a948c}
  .pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:10px;font-weight:600}
  .pi{background:#DDEEE4;color:#2F6F4E} .po{background:#F6E7D6;color:#B5702A}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}
  .bt{height:7px;background:#E3E8DE;border-radius:9px;overflow:hidden} .bf{height:100%;border-radius:9px}
  .ft{margin-top:22px;padding-top:8px;border-top:1px solid #DCE1D8;text-align:center;color:#8a948c;font-size:10px}
  </style></head><body>
  <div class="hd"><h1>Expense Report</h1><p>Expense Tracker · Jasin Creations</p><p>Generated ${esc(gen)} · ${sorted.length} transaction${sorted.length===1?"":"s"} · ${esc(first)} to ${esc(last)}</p></div>

  <h2>Overview</h2>
  <div class="grid">
    <div class="box"><div class="l">Funds remaining</div><div class="v ${rem<0?"neg":""}">${m(rem)}</div></div>
    <div class="box"><div class="l">Total funds</div><div class="v in">${m(tf)}</div></div>
    <div class="box"><div class="l">Funds used</div><div class="v out">${m(used)}</div></div>
    <div class="box"><div class="l">Opening balance</div><div class="v">${m(Number(S.cfg.opening)||0)}</div></div>
    <div class="box"><div class="l">Income recorded</div><div class="v in">${m(incTot)}</div></div>
    <div class="box"><div class="l">Runway</div><div class="v">${months===null?"—":(months<0?0:months).toFixed(1)+" months"}</div></div>
  </div>
  <p class="muted" style="margin:10px 0 0">You have spent <b>${rate.toFixed(0)}%</b> of your total funds. This month (${esc(mLabel(nowK,true))}) you spent <b>${m(em[nowK]||0)}</b>.</p>

  ${years.length?`<h2>Yearly summary</h2><table><thead><tr><th>Year</th><th class="r">Hours</th><th class="r">Days</th><th class="r">Earned</th><th class="r">Spent</th></tr></thead><tbody>${yearRows}</tbody></table>`:""}

  ${keys.length?`<h2>Monthly summary</h2><table><thead><tr><th>Month</th><th class="r">Income</th><th class="r">Expenses</th><th class="r">Net</th></tr></thead><tbody>${monthRows}</tbody></table>`:""}

  ${cats.length?`<h2>Spending by category</h2><table><thead><tr><th>Category</th><th></th><th class="r">Amount</th><th class="r">Share</th></tr></thead><tbody>${catRows}</tbody></table>`:""}

  <h2>All transactions</h2>
  <table><thead><tr><th>Date</th><th>Type</th><th>Category</th><th>Note</th><th class="r">Amount</th></tr></thead><tbody>${txRows}</tbody></table>

  <div class="ft">Expense Tracker · Jasin Creations</div>
  </body></html>`;
}

function exportPdf(){
  if(!S.tx.length){ toast("No entries to export yet"); return; }
  const html=buildReportHtml();
  if(nativeIO&&typeof nativeIO.exportPdf==="function"){
    nativeIO.exportPdf(html);                       // Android: printed from a hidden WebView
  } else {
    const f=document.createElement("iframe");       // browser fallback
    f.style.cssText="position:fixed;right:0;bottom:0;width:0;height:0;border:0";
    document.body.appendChild(f);
    f.contentDocument.open(); f.contentDocument.write(html); f.contentDocument.close();
    setTimeout(()=>{ f.contentWindow.focus(); f.contentWindow.print(); setTimeout(()=>f.remove(),2000); },400);
  }
}

async function inflate(u8){
  const ds=new DecompressionStream("deflate-raw");
  return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(ds)).arrayBuffer());
}
async function readXlsx(u8){
  const dv=new DataView(u8.buffer,u8.byteOffset,u8.byteLength); let e=u8.length-22;
  while(e>=0&&dv.getUint32(e,true)!==0x06054b50) e--;
  if(e<0) throw new Error("zip");
  const n=dv.getUint16(e+10,true), dec=new TextDecoder(), files={}; let p=dv.getUint32(e+16,true);
  for(let i=0;i<n;i++){
    const nl=dv.getUint16(p+28,true), el=dv.getUint16(p+30,true), cl=dv.getUint16(p+32,true);
    files[dec.decode(u8.subarray(p+46,p+46+nl))]={m:dv.getUint16(p+10,true),cs:dv.getUint32(p+20,true),lo:dv.getUint32(p+42,true)};
    p+=46+nl+el+cl;
  }
  const get=async name=>{
    const f=files[name]; if(!f) return null;
    const st=f.lo+30+dv.getUint16(f.lo+26,true)+dv.getUint16(f.lo+28,true), raw=u8.subarray(st,st+f.cs);
    return dec.decode(f.m===0?raw:await inflate(raw));
  };
  const xml=t=>new DOMParser().parseFromString(t,"application/xml");
  const txt=el=>[...el.getElementsByTagName("t")].map(x=>x.textContent).join("");
  const sstX=await get("xl/sharedStrings.xml");
  const sst=sstX?[...xml(sstX).getElementsByTagName("si")].map(txt):[];
  const sheetName=Object.keys(files).filter(k=>/^xl\/worksheets\/sheet\d+\.xml$/.test(k)).sort()[0];
  if(!sheetName) throw new Error("sheet");
  const rows=[];
  [...xml(await get(sheetName)).getElementsByTagName("row")].forEach((row,ri)=>{
    const r=[], idx=(+row.getAttribute("r")||ri+1)-1;
    [...row.getElementsByTagName("c")].forEach(c=>{
      const ref=c.getAttribute("r")||"", col=ref.replace(/\d/g,"").split("").reduce((a,ch)=>a*26+ch.charCodeAt(0)-64,0)-1, t=c.getAttribute("t");
      const v=c.getElementsByTagName("v")[0], vt=v?v.textContent:"";
      r[col>=0?col:r.length]= t==="s"?(sst[+vt]??"") : t==="inlineStr"?txt(c) : t==="str"?vt : (vt===""?"":Number(vt));
    });
    rows[idx]=r;
  });
  return rows;
}
function parseRows(rows){
  const h=(rows[0]||[]).map(x=>String(x??"").trim().toLowerCase()), ix=k=>h.indexOf(k);
  const c={date:ix("date"),type:ix("type"),cat:ix("category"),amt:ix("amount"),hours:ix("hours"),days:ix("days"),note:ix("note")};
  if(c.date<0||c.type<0||c.amt<0) throw new Error("cols");
  const out=[]; let skipped=0;
  rows.slice(1).forEach(r=>{
    if(!r||!r.some(v=>v!==undefined&&v!=="")) return;
    let d=r[c.date];
    d=typeof d==="number"?new Date(Date.UTC(1899,11,30)+Math.round(d)*86400000).toISOString().slice(0,10):String(d??"").trim().slice(0,10);
    const type=String(r[c.type]??"").trim().toLowerCase(), amt=Math.round((Number(r[c.amt])||0)*100)/100;
    if(!/^\d{4}-\d{2}-\d{2}$/.test(d)||(type!=="income"&&type!=="expense")||!(amt>0)){ skipped++; return; }
    const rec={id:uid(),type,date:d,amt,remark:String(r[c.note]??"").trim(),
      cat:String(c.cat>=0?(r[c.cat]??""):"").trim().slice(0,28)||(type==="income"?S.srcs[0]:"Other expense")};
    if(type==="income"){ const hh=Number(r[c.hours])||0, dd=Number(r[c.days])||0; if(hh) rec.hours=hh; if(dd) rec.days=dd; }
    out.push(rec);
  });
  return {out,skipped};
}
async function confirmExcel(u8){
  let res; try{ res=parseRows(await readXlsx(u8)); }catch(e){ toast("That isn't a valid Excel file with Date, Type and Amount columns."); return; }
  const key=t=>[t.date,t.type,t.cat.toLowerCase(),Number(t.amt).toFixed(2),t.remark||""].join("|");
  const have=new Set(S.tx.map(key)), fresh=[];
  res.out.forEach(t=>{ const k=key(t); if(!have.has(k)){ have.add(k); fresh.push(t); } });
  const n=fresh.length, word=n===1?"entry":"entries";
  sheet(`<h2>Import Excel file</h2>
  <p class="note">${n?`Found ${n} new ${word}. They are added to your existing entries; duplicates are ignored.`:"Nothing new to import."}${res.skipped?` ${res.skipped} row(s) were skipped (bad date, type or amount).`:""}</p>
  ${n?`<button class="btn" id="xl-go">Import ${n} ${word}</button>`:""}`);
  if(n) $("xl-go").addEventListener("click",()=>{
    fresh.forEach(t=>{
      const l=t.type==="expense"?S.cats:S.srcs, hit=l.find(x=>x.toLowerCase()===t.cat.toLowerCase());
      if(hit) t.cat=hit; else l.push(t.cat);
      S.tx.push(t);
    });
    save(); closeSheet(); render(); toast("Imported "+n+" "+word);
  });
}

/* ===================== banner ad position ===================== */
let bannerPos="none", bannerT=null;
function wantBanner(){
  if(adFree()||!inApp()) return "none";
  if(sheetEl&&sheetAd) return sheetAd;
  if(sheetEl||pageEl||drawerEl) return "none";
  if(view==="dash"||view==="expenses"||view==="income"||view==="report") return "bottom";
  return "none";
}
function syncBanner(){
  clearTimeout(bannerT);
  bannerT=setTimeout(()=>{
    syncNativeAd();
    const w=wantBanner();
    if(w===bannerPos) return;
    bannerPos=w;
    if(nativeIO&&typeof nativeIO.setBanner==="function") nativeIO.setBanner(w);
  },80);
}
/* Native ad in the menu or pages: tells the app where the "Advertisement" box is on screen. */
let nativeT = null;
function syncNativeAd(){
  clearTimeout(nativeT);
  nativeT = setTimeout(()=>{
    if(!(nativeIO&&typeof nativeIO.setNativeAd==="function")) return;
    const slot=$("adSlot");
    const container=(drawerEl&&drawerEl.querySelector(".drawer"))||pageEl||null;
    let show=false, r=null;
    if(slot&&container&&!sheetEl&&!adFree()&&!isPremium()){
      r=slot.getBoundingClientRect();
      const c=container.getBoundingClientRect();
      show=r.width>0&&r.bottom>c.top&&r.top<c.bottom;   // visible inside container viewport
    }
    if(show) nativeIO.setNativeAd(true,r.left,r.top,r.width,r.height);
    else nativeIO.setNativeAd(false,0,0,0,0);
  }, 140);
}

/* ===================== start ===================== */
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}
load();
setTimeout(()=>{
  const splash=$("splash");
  if(splash){
    splash.classList.add("hide");
    setTimeout(()=>{
      splash.remove();
      if(hasPin()) showLock(); else openApp();
    },400);
  } else {
    if(hasPin()) showLock(); else openApp();
  }
}, 2000);
